name: Approve and publish weekly brief

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Immutable approval ID created by the review service
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: approve-weekly-brief-${{ inputs.approval_id }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Load immutable approval
        id: approval
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.REVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.REVIEW_ACCESS_CLIENT_SECRET }}
          REVIEW_SERVICE_KEY: ${{ secrets.REVIEW_SERVICE_KEY }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Review-Service-Key: $REVIEW_SERVICE_KEY" \
            "$REVIEW_API_URL/api/internal/approvals/$APPROVAL_ID")"
          case "$(jq -r .status <<< "$response")" in pending|running) ;; *) exit 1 ;; esac
          test "$(jq -r .issue_state <<< "$response")" = "publishing"
          test "$(jq -r .approved_sha <<< "$response")" = "$(jq -r .draft_sha <<< "$response")"
          test "$(jq -r .approved_sha <<< "$response")" = "$(jq -r .preview_sha <<< "$response")"
          echo "issue_date=$(jq -r .issue_date <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "pull_request=$(jq -r .pull_request <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "approved_sha=$(jq -r .approved_sha <<< "$response")" >> "$GITHUB_OUTPUT"

      - name: Mark approval running
        id: running
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.REVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.REVIEW_ACCESS_CLIENT_SECRET }}
          REVIEW_SERVICE_KEY: ${{ secrets.REVIEW_SERVICE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Review-Service-Key: $REVIEW_SERVICE_KEY" \
            --data '{"status":"running"}' \
            "$REVIEW_API_URL/api/internal/approvals/$APPROVAL_ID/result"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Inspect pull request at approved SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.approval.outputs.pull_request }}
          EXPECTED_BRANCH: ${{ steps.approval.outputs.branch }}
          EXPECTED_SHA: ${{ steps.approval.outputs.approved_sha }}
        run: |
          details="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          test "$(jq -r .state <<< "$details")" = "open"
          test "$(jq -r .base.ref <<< "$details")" = "main"
          test "$(jq -r .head.ref <<< "$details")" = "$EXPECTED_BRANCH"
          test "$(jq -r .head.sha <<< "$details")" = "$EXPECTED_SHA"
          test "$(jq -r .head.repo.full_name <<< "$details")" = "$GITHUB_REPOSITORY"

      - name: Check out exact approved revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.approval.outputs.approved_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci

      - name: Guard the complete weekly pull request diff
        env:
          ISSUE_DATE: ${{ steps.approval.outputs.issue_date }}
        run: |
          git fetch origin main
          npm run weekly:guard-diff -- "$ISSUE_DATE" origin/main HEAD

      - name: Mark report approved
        env:
          ISSUE_DATE: ${{ steps.approval.outputs.issue_date }}
        run: npm run report:approve -- "$ISSUE_DATE"

      - name: Validate approved publication
        run: npm run verify

      - name: Guard approval-only change
        env:
          ISSUE_DATE: ${{ steps.approval.outputs.issue_date }}
        run: |
          expected="src/data/reports/$ISSUE_DATE.json"
          test "$(git diff --name-only)" = "$expected"

      - name: Commit approval to the PR branch
        id: commit
        env:
          ISSUE_DATE: ${{ steps.approval.outputs.issue_date }}
          HEAD_REF: ${{ steps.approval.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/data/reports/$ISSUE_DATE.json"
          git commit -m "content: approve weekly brief $ISSUE_DATE"
          approval_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$approval_commit" >> "$GITHUB_OUTPUT"

      - name: Dispatch required CI for approval commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.approval.outputs.branch }}
        run: gh workflow run ci.yml --ref "$HEAD_REF"

      - name: Wait for exact approval-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.approval.outputs.branch }}
          APPROVAL_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --branch "$HEAD_REF" --event workflow_dispatch --limit 10 \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$APPROVAL_COMMIT\") | .databaseId" | head -1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then echo "Could not find CI for $APPROVAL_COMMIT" >&2; exit 1; fi
          gh run watch "$run_id" --exit-status

      - name: Merge exact validated head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.approval.outputs.pull_request }}
          APPROVAL_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          gh pr ready "$PULL_REQUEST" || true
          gh pr merge "$PULL_REQUEST" --squash --delete-branch --match-head-commit "$APPROVAL_COMMIT"
          merge_sha="$(gh pr view "$PULL_REQUEST" --json mergeCommit --jq .mergeCommit.oid)"
          test -n "$merge_sha"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Record merge and start production deployment watcher
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          APPROVAL_COMMIT: ${{ steps.commit.outputs.sha }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.REVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.REVIEW_ACCESS_CLIENT_SECRET }}
          REVIEW_SERVICE_KEY: ${{ secrets.REVIEW_SERVICE_KEY }}
        run: |
          jq -n --arg approvalCommitSha "$APPROVAL_COMMIT" --arg mergeCommitSha "$MERGE_SHA" \
            '{status:"merged",approvalCommitSha:$approvalCommitSha,mergeCommitSha:$mergeCommitSha}' \
            | curl --fail --silent --show-error -X POST \
              -H "Content-Type: application/json" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "X-Review-Service-Key: $REVIEW_SERVICE_KEY" \
              --data-binary @- "$REVIEW_API_URL/api/internal/approvals/$APPROVAL_ID/result"
          gh workflow run record-production-deployment.yml --ref main -f merge_sha="$MERGE_SHA"

      - name: Record failure
        if: failure() && steps.running.outputs.started == 'true'
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.REVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.REVIEW_ACCESS_CLIENT_SECRET }}
          REVIEW_SERVICE_KEY: ${{ secrets.REVIEW_SERVICE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Review-Service-Key: $REVIEW_SERVICE_KEY" \
            --data '{"status":"failed","error":"Approval or publication workflow failed; inspect the GitHub Actions run."}' \
            "$REVIEW_API_URL/api/internal/approvals/$APPROVAL_ID/result" || true
