name: Approve weekly brief

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number containing the draft
        required: true
        type: number
      report:
        description: Issue date in YYYY-MM-DD format
        required: true
        type: string
      confirmation:
        description: Enter the issue date again to confirm approval
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: approve-weekly-brief-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  approve:
    name: Validate and approve draft
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm approval request
        env:
          INPUT_REPORT: ${{ inputs.report }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ! [[ "$INPUT_REPORT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Report must use YYYY-MM-DD format." >&2
            exit 1
          fi
          if [ "$INPUT_REPORT" != "$INPUT_CONFIRMATION" ]; then
            echo "Confirmation must exactly match the issue date." >&2
            exit 1
          fi

      - name: Inspect pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          details="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PULL_REQUEST")"
          state="$(jq -r '.state' <<< "$details")"
          base_ref="$(jq -r '.base.ref' <<< "$details")"
          head_ref="$(jq -r '.head.ref' <<< "$details")"
          head_sha="$(jq -r '.head.sha' <<< "$details")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$details")"

          if [ "$state" != "open" ]; then
            echo "Pull request must be open." >&2
            exit 1
          fi
          if [ "$base_ref" != "main" ]; then
            echo "Pull request must target main." >&2
            exit 1
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "Approval is limited to branches in this repository." >&2
            exit 1
          fi

          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out draft branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pull_request.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve report
        env:
          INPUT_REPORT: ${{ inputs.report }}
        run: npm run report:approve -- "$INPUT_REPORT"

      - name: Validate approved publication
        run: npm run verify

      - name: Guard changed files
        env:
          INPUT_REPORT: ${{ inputs.report }}
        run: |
          expected="src/data/reports/$INPUT_REPORT.json"
          changed="$(git diff --name-only)"
          if [ "$changed" != "$expected" ]; then
            echo "Approval changed unexpected files:" >&2
            echo "$changed" >&2
            exit 1
          fi

      - name: Commit approval to pull request
        env:
          HEAD_REF: ${{ steps.pull_request.outputs.head_ref }}
          INPUT_REPORT: ${{ inputs.report }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/data/reports/$INPUT_REPORT.json"
          git commit -m "content: approve weekly brief $INPUT_REPORT"
          git push origin "HEAD:refs/heads/$HEAD_REF"

      - name: Record approval on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PULL_REQUEST: ${{ inputs.pull_request }}
          INPUT_REPORT: ${{ inputs.report }}
        run: |
          gh pr comment "$INPUT_PULL_REQUEST" --body "Issue $INPUT_REPORT passed publication validation and was marked approved. Review the refreshed Cloudflare preview, then merge this pull request to publish it."
