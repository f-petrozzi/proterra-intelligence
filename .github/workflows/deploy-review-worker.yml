name: Deploy review worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "review-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-review-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-review-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: review-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Reject unresolved deployment configuration
        run: npm run review:config-check
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply proterra-intelligence-review --remote --config review-worker/wrangler.jsonc
      - name: Deploy main-only review worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config review-worker/wrangler.jsonc
